[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["utils", "config", "models"]
exclude = ["/models/.vscode/**"]

[project]
name = "api-test-devops-portfolio"
description = "APIテスト + DevOps統合ポートフォリオ"
version = "0.1.0"
authors = [
    {name = "Yuta"},
]
readme = "README.md"
requires-python = "==3.14.*"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

# 本番依存関係
dependencies = [
    "httpx>=0.27.0",                # 非同期HTTPクライアント
    "structlog>=26.1.0",            # 構造化ログ
    "pydantic[email]>=2.13.4",      # データバリデーション
    "pydantic-settings>=2.15.0",     # 設定管理
    "sentry-sdk[httpx]>=2.68.0,<3.0.0", # エラー監視（httpx統合）
]

[project.urls]
Homepage = "https://github.com/yaoki-dev/api-test-devops-portfolio"
Repository = "https://github.com/yaoki-dev/api-test-devops-portfolio"
Documentation = "https://yaoki-dev.github.io/api-test-devops-portfolio"
Issues = "https://github.com/yaoki-dev/api-test-devops-portfolio/issues"

[dependency-groups]
dev = [
    # テスト
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=4.1.0",
    "pytest-xdist>=3.5.0",
    "pytest-socket>=0.8.0,<0.9",     # unit層のネットワーク構造的分離
    "defusedxml>=0.7.1",              # CI JUnit XML parsing
    "genbadge[coverage]==1.1.3",  # Coverage badge生成（Q19 C3: uv.lock管理）
    "respx>=0.23.1",            # httpx用モックライブラリ
    "psutil>=6.1.1",            # tests/performance のプロセスリソース計測
    "pyyaml>=6.0",              # repo_contract テストのワークフローYAMLパース
    # 品質管理
    "ruff>=0.16.3,<0.17",       # pre-commit hook: v0.16.1（.pre-commit-config.yaml参照）
    "zizmor==1.29.0",
    "mypy>=2.3.0,<3.0.0",
    "bandit>=1.8.6",
    "safety>=3.8.1",
    # 開発サポート
    "pre-commit>=4.6.2",
]
# pytest設定
[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",                        # verbose出力（CI/CD向け）
    "-ra",                       # すべての結果を表示
    "--strict-markers",          # 未定義マーカーでエラー
    "--strict-config",           # 設定エラーで停止
    "--cov",                     # カバレッジ対象: [tool.coverage.run].source参照
    "--cov-report=term-missing", # 欠損行表示
    "--cov-report=html:reports/htmlcov",  # HTMLレポート
    "--cov-report=xml:reports/coverage.xml",  # XMLレポート
    "--cov-fail-under=85",       # 安全ネット: 85%(大幅な後退防止用下限) (カバレッジ対象: unit, integration)
]
markers = [
    "unit: Unit tests (fast, isolated)",
    "integration: Integration tests (external dependencies)",
    "performance: Performance tests (latency/throughput)",
    "slow: Slow tests (>3s, excluded from local dev)",
    "external: External API tests (weekly CI only)",
    "smoke: Smoke tests (basic functionality)",
    "repo_contract: Repository-static contract tests (require the full repo tree; host-only)",
]
asyncio_mode = "auto"            # 非同期テスト自動検出

# カバレッジ設定
[tool.coverage.run]
source = ["utils", "config", "models"]  # Coverage対象: 3モジュール
omit = [
    "tests/*",
    "venv/*",
    "*.egg",
    ".tox/*",
    "build/*",
    "docs/*",
    "*/__init__.py",
]
branch = true                    # ブランチカバレッジも計測

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\(.*Protocol.*\\):",
    "@(abc\\.)?abstractmethod",
]
show_missing = true
precision = 2

# Ruff設定（統合リンター・フォーマッター）
[tool.ruff]
target-version = "py314"
line-length = 100  # DevOps軽量化: コミット時の厳密度緩和
fix = true
extend-exclude = [".history"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort (import sorting)
    "C90",  # mccabe complexity
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "S",    # flake8-bandit (security)
    "PTH",  # flake8-use-pathlib
]
ignore = [
    "S101",  # Use of assert detected
    "S603",  # subprocess-without-shell-equals-true
    "B008",  # Do not perform function calls in argument defaults
]
unfixable = ["F841"]  # unused variables

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "D"]  # Allow assert in tests; "D" is a pre-emptive exemption (not in select)

[tool.ruff.lint.isort]
known-first-party = ["utils", "config", "tests"]
section-order = ["future", "standard-library", "third-party", "first-party", "local-folder"]

# mypy設定（型チェック）
[tool.mypy]
python_version = "3.14"
plugins = ["pydantic.mypy"]
explicit_package_bases = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true


# bandit設定（セキュリティスキャン）
[tool.bandit]
exclude_dirs = ["tests"]
skips = ["B101", "B601"]  # assertとshell使用の警告を除外
